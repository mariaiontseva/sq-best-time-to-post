<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Best Time to Post — SmarterQueue</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ig:#E1306C;--fb:#1877F2;
  --ok:#10b981;--warn:#f59e0b;--err:#ef4444;
  --g50:#fafafa;--g100:#f4f4f5;--g200:#e4e4e7;--g300:#d4d4d8;
  --g400:#a1a1aa;--g500:#71717a;--g600:#52525b;--g700:#3f3f46;--g800:#27272a;--g900:#18181b;
  --r:10px;--sh:0 1px 2px rgba(0,0,0,.04);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',system-ui,sans-serif;background:var(--g50);color:var(--g800);-webkit-font-smoothing:antialiased}

/* ── Topbar ── */
.topbar{position:sticky;top:0;z-index:100;height:52px;background:#fff;border-bottom:1px solid var(--g200);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.topbar-l{display:flex;align-items:center;gap:10px}
.tlogo{width:28px;height:28px;background:linear-gradient(135deg,#833ab4,#E1306C,#1877F2);border-radius:8px;display:flex;align-items:center;justify-content:center}
.tlogo svg{width:15px;height:15px}
.tbrand{font-size:14px;font-weight:700;color:var(--g900)}
.topbar-r{display:flex;gap:8px}
.nbtn{display:flex;align-items:center;gap:6px;height:32px;padding:0 14px;border:1px solid var(--g200);border-radius:8px;background:#fff;font-family:inherit;font-size:12px;font-weight:600;color:var(--g600);cursor:pointer;transition:all .15s;white-space:nowrap}
.nbtn:hover{border-color:var(--g300);background:var(--g50)}
.nbtn.meta{border-color:rgba(225,48,108,.25);color:var(--ig)}
.nbtn.meta:hover{background:rgba(225,48,108,.04)}
.nbtn.done{border-color:var(--ok);color:var(--ok);cursor:default}
.nbtn.done:hover{background:#fff}
.nbtn svg{width:14px;height:14px;flex-shrink:0}

/* ── Layout ── */
.main{max-width:960px;margin:0 auto;padding:24px 20px 80px}

/* ── Hero ── */
.hero{text-align:center;padding:60px 0 32px;transition:all .4s}
.hero.gone{display:none}
.hero h1{font-size:30px;font-weight:800;letter-spacing:-.03em;color:var(--g900);margin-bottom:10px}
.hero p{font-size:15px;color:var(--g500);max-width:480px;margin:0 auto;line-height:1.6}

/* ── Feed ── */
.feed-panel{display:none;background:#fff;border:1px solid var(--g200);border-radius:var(--r);margin-bottom:20px;overflow:hidden}
.feed-panel.show{display:block;animation:fadeUp .3s}
.feed-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--g100);font-size:12px;font-weight:700;color:var(--g800)}
.feed-status{font-weight:600;color:var(--ok)}
.fi{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--g100);font-size:12px;animation:slideIn .2s}
.fi:last-child{border-bottom:none}
.fi-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--g300)}
.fi.active .fi-dot{background:var(--ig);animation:pulse .8s infinite}
.fi.done .fi-dot{background:var(--ok);animation:checkPop .3s ease-out}
.fi.warn .fi-dot{background:var(--warn)}
.fi.fail .fi-dot{background:var(--err)}
.fi-label{color:var(--g600);flex:1;min-width:0}
.fi.done .fi-label{color:var(--g700)}
.fi-val{color:var(--g400);font-size:11px;text-align:right;flex-shrink:0;max-width:55%}
.fi.done .fi-val{color:var(--g500)}
.fi.warn .fi-val{color:var(--warn)}
.fi.fail .fi-val{color:var(--err)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes slideIn{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes checkPop{0%{transform:scale(0)}60%{transform:scale(1.3)}100%{transform:scale(1)}}

/* ── Profile Cards ── */
.profiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-bottom:20px}
.pcard{display:none;background:#fff;border:1px solid var(--g200);border-radius:var(--r);padding:20px}
.pcard.show{display:block;animation:fadeUp .3s}
.pcard-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.av{width:44px;height:44px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#fff;flex-shrink:0}
.av.ig{background:linear-gradient(135deg,#833ab4,#E1306C)}
.av.fb{background:var(--fb)}
.av img{width:100%;height:100%;object-fit:cover}
.pname{font-size:15px;font-weight:700;color:var(--g900)}
.phandle{font-size:12px;color:var(--g500);margin-top:1px}
.pcat{font-size:11px;font-weight:600;margin-top:2px;color:var(--ig)}
.pcat.fb{color:var(--fb)}
.pstats{display:flex;gap:16px;padding-top:12px;border-top:1px solid var(--g100)}
.ps{text-align:center}
.ps-n{font-size:17px;font-weight:800;color:var(--g900);display:block}
.ps-l{font-size:10px;color:var(--g500);text-transform:uppercase;letter-spacing:.04em}

/* ── Signal Cards ── */
.sigs{display:none;margin-bottom:20px}
.sigs.show{display:block;animation:fadeUp .3s}
.stitle{font-size:12px;font-weight:700;color:var(--g800);margin-bottom:10px;text-transform:uppercase;letter-spacing:.06em}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.sig{background:#fff;border:1px solid var(--g200);border-radius:var(--r);padding:16px;border-left:3px solid transparent}
.sig.ig-accent{border-left-color:var(--ig)}
.sig.fb-accent{border-left-color:var(--fb)}
.sig-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sig-plat{font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em}
.sig-plat.ig{background:rgba(225,48,108,.08);color:var(--ig)}
.sig-plat.fb{background:rgba(24,119,242,.08);color:var(--fb)}
.sig-badge{font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px}
.sig-badge.ok{background:rgba(16,185,129,.12);color:var(--ok);font-weight:700}
.sig-name{font-size:13px;font-weight:600;color:var(--g800);margin-bottom:2px}
.sig-val{font-size:22px;font-weight:800;color:var(--g900);line-height:1.2}
.sig-desc{font-size:11px;color:var(--g500);margin-top:4px;line-height:1.4}
.sig-wt{margin-top:10px;padding-top:8px;border-top:1px solid var(--g100)}
.sig-wt-bar{height:4px;border-radius:2px;background:var(--g100);overflow:hidden;margin-bottom:4px}
.sig-wt-fill{height:100%;border-radius:2px;background:var(--ok)}
.sig-wt-label{font-size:10px;font-weight:600;color:var(--g400)}

/* ── Recs ── */
.recs{display:none;margin-bottom:20px}
.recs.show{display:block;animation:fadeUp .3s}
.rdesc{font-size:12px;color:var(--g500);margin-bottom:10px;line-height:1.5}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:10px}
.rec{background:#fff;border:1px solid var(--g200);border-radius:var(--r);padding:14px;text-align:center}
.rec-rank{font-size:9px;font-weight:700;color:var(--g400);letter-spacing:.06em;margin-bottom:6px}
.rec-tag{display:inline-block;font-size:9px;font-weight:700;padding:2px 7px;border-radius:4px;margin-bottom:4px}
.rec-tag.ig{background:rgba(225,48,108,.08);color:var(--ig)}
.rec-tag.fb{background:rgba(24,119,242,.08);color:var(--fb)}
.rec-time{font-size:20px;font-weight:800;color:var(--g900)}
.rec-day{font-size:12px;font-weight:600;color:var(--g600);margin-bottom:5px}
.rec-why{font-size:10px;color:var(--g500)}
.rec-tip{font-size:11px;color:var(--g400);margin-top:14px;text-align:center;line-height:1.5;font-style:italic}

/* ── Calendar ── */
.sched{display:none;margin-bottom:24px}
.sched.show{display:block;animation:fadeUp .3s}
.ccard{background:#fff;border:1px solid var(--g200);border-radius:var(--r);padding:24px}
.chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:10px}
.ctitle{font-size:16px;font-weight:700;color:var(--g900)}
.tabs{display:flex;gap:2px;background:var(--g100);border-radius:8px;padding:2px}
.tab{padding:6px 14px;border-radius:6px;border:none;background:transparent;font-family:inherit;font-size:12px;font-weight:500;color:var(--g500);cursor:pointer;transition:all .15s}
.tab:hover{color:var(--g700)}
.tab.on{background:#fff;color:var(--g800);box-shadow:var(--sh);font-weight:600}
.tab.off{opacity:.35;cursor:not-allowed}
.leg{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.lbar{width:140px;height:10px;border-radius:3px}
.lbar.combined{background:linear-gradient(90deg,#f0fdf4,#86efac,#22c55e,#15803d)}
.lbar.ig{background:linear-gradient(90deg,#fce4ec,#f48fb1,#e91e63,#ad1457)}
.lbar.fb{background:linear-gradient(90deg,#e3f2fd,#64b5f6,#1877F2,#0d47a1)}
.llbl{display:flex;justify-content:space-between;width:140px;font-size:9px;color:var(--g400)}
.gwrap{overflow-x:auto}
.grid{display:grid;grid-template-columns:48px repeat(7,1fr);gap:2px;min-width:600px}
.gh{font-size:10px;font-weight:600;color:var(--g400);text-align:center;padding:6px 0;letter-spacing:.03em}
.gt{font-size:9px;color:var(--g400);text-align:right;padding-right:8px;display:flex;align-items:center;justify-content:flex-end}
.gc{height:24px;border-radius:3px;background:var(--g100);position:relative;cursor:default;transition:transform .15s,outline .1s}
.gc:hover{outline:2px solid var(--g800);outline-offset:-1px;z-index:2;transform:scale(1.08)}
.gc .tip{display:none;position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);background:var(--g900);color:#fff;font-size:11px;font-weight:500;padding:6px 10px;border-radius:6px;white-space:nowrap;z-index:10;pointer-events:none;line-height:1.4;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.gc .tip::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:4px solid transparent;border-top-color:var(--g900)}
.gc:hover .tip{display:block}

/* ── Tab Explainer ── */
.texpl{margin-bottom:18px;padding:20px;background:var(--g50);border:1px solid var(--g100);border-radius:10px;animation:fadeUp .25s}
.texpl-title{font-size:18px;font-weight:800;color:var(--g900);letter-spacing:-.02em;margin-bottom:4px}
.texpl-sub{font-size:13px;color:var(--g500);margin-bottom:16px;line-height:1.5}
.texpl-insight{background:#fff;border:1px solid var(--g200);border-radius:8px;padding:16px 20px;margin-bottom:14px;font-size:13px;color:var(--g600);line-height:1.6}
.texpl-steps{display:flex;flex-direction:column;gap:8px}
.texpl-step{display:flex;gap:10px;align-items:flex-start}
.texpl-step-n{width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.texpl-step-n.fb{background:rgba(24,119,242,.1);color:var(--fb)}
.texpl-step-n.ig{background:rgba(225,48,108,.1);color:var(--ig)}
.texpl-step-n.gr{background:rgba(16,185,129,.1);color:var(--ok)}
.texpl-step-t{font-size:13px;color:var(--g600);line-height:1.55}
.texpl-step-t strong{color:var(--g800)}
.texpl-highlight{margin-top:12px;padding:10px 14px;background:rgba(16,185,129,.06);border:1px solid rgba(16,185,129,.15);border-radius:6px;font-size:12px;color:var(--ok);line-height:1.5}
.texpl-wbar{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;margin:12px 0 8px}
.texpl-wbar-seg{height:100%}
.texpl-wbar-seg.fb{background:var(--fb)}
.texpl-wbar-seg.ig{background:var(--ig)}
.texpl-wlabels{display:flex;gap:16px;font-size:11px;color:var(--g500)}
.texpl-wlabels strong{font-weight:700}

@media(max-width:768px){
  .topbar{padding:0 12px}.topbar-r{gap:4px}.nbtn{padding:0 8px;font-size:11px;gap:4px}
  .main{padding:16px 12px 60px}.hero h1{font-size:24px}.hero p{font-size:13px}
  .profiles{grid-template-columns:1fr}.sgrid{grid-template-columns:1fr 1fr}
  .chead{flex-direction:column;align-items:flex-start}.ccard{padding:16px}
}
</style>
</head>
<body>

  <div class="topbar-l">
    <div class="tlogo"><svg viewBox="0 0 24 24" fill="white"><path d="M13 3v7h7l-9 11v-7H4l9-11z"/></svg></div>

  </div>
  <div class="topbar-r">
    <button class="nbtn meta" id="btn-meta" onclick="connectMeta()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>

</nav>

<div class="main">
  <div class="hero" id="hero">
    <h1>Post When Your Audience Is Actually Online</h1>

<script>
const META_APP_ID='1428744032258642';
window.fbAsyncInit=function(){FB.init({appId:META_APP_ID,cookie:true,xfbml:false,version:'v21.0'})};
(function(d,s,id){var js,fjs=d.getElementsByTagName(s)[0];if(d.getElementById(id))return;js=d.createElement(s);js.id=id;js.src="https://connect.facebook.net/en_US/sdk.js";fjs.parentNode.insertBefore(js,fjs)}(document,'script','facebook-jssdk'));
</script>

<script>
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const META_CONFIG_ID='1826888727999876';
const state={ig:false,fb:false};
const results={};
const scoreCache={};
const signalInfo={};
let curTab='fb';

// ── Helpers ──
function fmt(n){return n!=null?Number(n).toLocaleString():'—'}
function fmtH(h){if(h===0)return'12 AM';if(h<12)return h+' AM';if(h===12)return'12 PM';return(h-12)+' PM'}
function $(id){return document.getElementById(id)}

// ── Paginated fetch: follows paging.next to get ALL results ──
async function gqlAll(path,token,maxPages){
  maxPages=maxPages||10;
  let all=[];
  let url=`https://graph.facebook.com/v21.0/${path}${path.includes('?')?'&':'?'}access_token=${token}`;
  let pg=0;
  while(url&&pg<maxPages){
    try{
      const r=await fetch(url);
      const j=await r.json();
      if(j.error){console.warn('gqlAll error on page',pg,j.error.message);break}
      const count=j.data?.length||0;
      all=all.concat(j.data||[]);
      console.log(`gqlAll page ${pg}: ${count} items (total: ${all.length}), has next: ${!!j.paging?.next}`);
      url=j.paging?.next||null;
      pg++;
    }catch(e){console.error('gqlAll fetch error:',e);break}
  }
  console.log(`gqlAll done: ${all.length} total items across ${pg} pages`);
  return all;
}

function setAvatar(elId,url){
  if(!url)return;
  const el=$(elId);
  const img=new Image();
  img.onload=()=>{el.innerHTML='';el.appendChild(img)};
  img.onerror=()=>{};
  img.src=url;
}

// ── Feed ──
function feedStart(id,label){
  $('feed-panel').classList.add('show');
  const item=document.createElement('div');
  item.id='f-'+id;item.className='fi active';
  item.innerHTML=`<div class="fi-dot"></div><span class="fi-label">${label}</span><span class="fi-val" id="fv-${id}"></span>`;
  $('feed-list').appendChild(item);
}
function feedEnd(id,val,status){
  const item=$('f-'+id);
  if(!item)return;
  item.className='fi '+status;
  const v=$('fv-'+id);
  if(v)v.textContent=val||'';
}

// ── Meta Connect ──
function connectMeta(){
  if(!window.FB){alert('Facebook SDK not loaded.');return}
  const btn=$('btn-meta');
  btn.textContent='Connecting...';btn.style.pointerEvents='none';
  FB.getLoginStatus(function(s){
    if(s.status==='connected'){
      FB.api('/me/permissions','DELETE',function(){FB.logout(function(){doMetaLogin()})});
    }else{doMetaLogin()}
  });
}

function doMetaLogin(){
  const opts=META_CONFIG_ID
    ?{config_id:META_CONFIG_ID,response_type:'token',override_default_response_type:true}
    :{scope:'pages_show_list,business_management',auth_type:'rerequest'};
  FB.login(function(r){
    if(r.authResponse){
      state.ig=true;state.fb=true;
      $('hero').classList.add('gone');
      $('t-ig').classList.remove('off');
      $('t-fb').classList.remove('off');
      feedStart('connect','Authenticated with Meta');
      feedEnd('connect','Connected','done');
      fetchMetaData(r.authResponse.accessToken);
    }else{
      const btn=$('btn-meta');
      btn.textContent='Connect Meta';btn.style.pointerEvents='';
    }
  },opts);
}

function setMetaBtnDone(){
  const btn=$('btn-meta');
  btn.className='nbtn done';
  btn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg> Meta Connected';
  btn.onclick=null;
}

async function gql(path,token){
  const sep=path.includes('?')?'&':'?';
  const r=await fetch(`https://graph.facebook.com/v21.0/${path}${sep}access_token=${token}`);
  return r.json();
}

// ── Main Fetch Flow ──
async function fetchMetaData(token){
  const R={};
  try{
    // 1. Pages
    feedStart('pages','Finding your Facebook Page');
    const pages=await gql('me/accounts?fields=id,name,access_token,instagram_business_account,category,fan_count,about,picture',token);
    const p=pages.data||[];
    const page=p[0];
    if(!page){feedEnd('pages','No pages found — check permissions','fail');return}
    feedEnd('pages',page.name+(page.category?' · '+page.category:''),'done');
    const pt=page.access_token;

    // Show FB card
    showFBCard(page);

    // 2. IG Profile
    const igAcc=page.instagram_business_account;
    if(igAcc){
      const igId=igAcc.id;
      feedStart('ig-prof','Loading Instagram profile');
      const prof=await gql(`${igId}?fields=id,username,name,followers_count,follows_count,media_count,biography,profile_picture_url`,token);
      R.ig_profile={status:'ok',data:prof};
      feedEnd('ig-prof',`@${prof.username||'?'} · ${fmt(prof.followers_count)} followers`,'done');
      showIGCard(prof,page.category);

      // 3. IG Posts (with pagination — fetch ALL)
      feedStart('ig-posts','Analyzing your Instagram content');
      const md=await gqlAll(`${igId}/media?fields=id,caption,timestamp,media_type,like_count,comments_count&limit=100`,token,10);
      R._igPosts=md;
      R.ig_post_history={status:md.length>0?'ok':'warn',count:md.length};
      if(md.length===0){
        feedEnd('ig-posts','0 posts found','warn');
      }else{
        feedEnd('ig-posts',md.length+' posts analyzed','done');
      }
      updateIGPosts(prof.media_count,md.length);

      // 4. IG Online Followers (KEY metric)
      feedStart('ig-online','Detecting when your followers are online');
      try{
        const ol=await gql(`${igId}/insights?metric=online_followers&period=lifetime`,token);
        const olRaw=ol.data?.[0]?.values?.[0]?.value;
        const olData=(olRaw&&typeof olRaw==='object'&&Object.keys(olRaw).length>0)?olRaw:null;
        R.ig_online_followers={status:olData?'ok':'warn',data:olData};
        if(olData){
          const entries=Object.entries(olData).sort((a,b)=>b[1]-a[1]);
          const peak=entries[0];
          if(peak){
            feedEnd('ig-online',`Peak activity: ${fmtH(+peak[0])}`,'done');
          }else{
            feedEnd('ig-online','Using engagement history instead','warn');
          }
        }else{
          feedEnd('ig-online','Using engagement history instead','warn');
          console.warn('online_followers response:',JSON.stringify(ol));
        }
      }catch(e){
        R.ig_online_followers={status:'fail',data:null};
        feedEnd('ig-online','Using engagement history instead','warn');
      }
    }else{
      feedStart('ig-prof','Instagram Business account');
      feedEnd('ig-prof','Not linked to this page — switch to Business/Creator account in IG settings and link to your FB Page','fail');
      state.ig=false;
      $('t-ig').classList.replace('on','off');
      const c=$('pc-ig');c.classList.add('show');
      $('ig-name').textContent='Not connected';
      $('ig-handle').textContent='Link an IG Business account to your FB Page';
      $('ig-stats').innerHTML='<div class="ps"><span class="ps-n" style="color:var(--err)">0</span><span class="ps-l">No IG data</span></div>';
    }

    // 5. FB Posts (with pagination — fetch ALL)
    feedStart('fb-posts','Analyzing your Facebook engagement');
    const pd=await gqlAll(`${page.id}/feed?fields=id,message,created_time,shares,reactions.summary(true),comments.summary(true)&limit=100`,pt,10);
    R.fb_post_history={status:pd.length>0?'ok':'warn',count:pd.length};
    feedEnd('fb-posts',pd.length+' posts with engagement',pd.length>0?'done':'warn');
    updateFBPosts(pd.length);

    // Compute FB engagement by (day,hour)
    if(pd.length>0){
      const he={};
      for(const post of pd){
        const dt=new Date(post.created_time);
        const h=dt.getUTCHours(),d=dt.getUTCDay();
        const k=d+'-'+h;
        const eng=(post.reactions?.summary?.total_count||0)+(post.comments?.summary?.total_count||0)+(post.shares?.count||0);
        if(!he[k])he[k]={t:0,c:0};
        he[k].t+=eng;he[k].c++;
      }
      const avg={};
      for(const[k,v]of Object.entries(he))avg[k]=Math.round(v.t/v.c*100)/100;
      R.fb_inferred_times={status:'ok',data:avg};
    }

    // BUILD
    feedStart('build','Building your personalized schedule');
    results.meta=R;
    buildDashboard();
    feedEnd('build','Schedule ready!','done');
    $('feed-status').textContent='Analysis complete';
    setMetaBtnDone();

    // Auto-collapse feed after 2.5s
    setTimeout(()=>{
      const fl=$('feed-list');
      const head=document.querySelector('.feed-head span:first-child');
      if(fl&&head){
        fl.style.maxHeight=fl.scrollHeight+'px';
        fl.style.transition='max-height 0.4s ease, opacity 0.3s ease';
        fl.style.overflow='hidden';
        setTimeout(()=>{fl.style.maxHeight='0';fl.style.opacity='0'},50);
        setTimeout(()=>{fl.style.display='none';head.textContent='Analysis complete — scroll down for your results'},500);
      }
    },2500);

  }catch(e){
    console.error('fetchMetaData error:',e);
    feedStart('error','Error fetching data');
    feedEnd('error',e.message||'Unknown error — check console','fail');
    try{
      results.meta=R;
      buildDashboard();
    }catch(e2){console.error('Dashboard build after error:',e2)}
  }
}

// ═══════════════════════════════════
// SCORING ENGINE
// ═══════════════════════════════════
function computeAllScores(){
  if(state.ig)scoreCache.ig=computeIG();
  if(state.fb)scoreCache.fb=computeFB();
  scoreCache.combined=computeCombined();
}

function computeIG(){
  const grid=Array.from({length:7},()=>new Float64Array(24));
  const ol=results.meta?.ig_online_followers?.data;
  const olKeys=ol&&typeof ol==='object'?Object.keys(ol):[];
  const posts=results.meta?._igPosts||[];

  if(ol&&olKeys.length>0){
    // BEST: real online_followers hourly data
    const vals=Object.values(ol).map(Number).filter(v=>!isNaN(v));
    if(vals.length>0){
      const mx=Math.max(...vals),mn=Math.min(...vals),range=(mx-mn)||1;
      const hourly={};
      for(let h=0;h<24;h++){
        const raw=Number(ol[String(h)])||0;
        hourly[h]=Math.max(0,Math.min(1,(raw-mn)/range));
      }
      const dayF=computeIGDayFactor(posts);
      for(let d=0;d<7;d++)for(let h=0;h<24;h++)grid[d][h]=hourly[h]*0.8+dayF[d]*0.2;
      const peakH=Object.entries(ol).sort((a,b)=>(Number(b[1])||0)-(Number(a[1])||0))[0];
      signalInfo.ig={type:'real',peak:peakH?Number(peakH[1])||0:0,peakHour:peakH?parseInt(peakH[0])||0:0,postCount:posts.length,weight:0.60};
      return grid;
    }
  }

  if(posts.length>0){
    // GOOD: no online_followers, but we have post history — infer from engagement
    const he={};
    for(const p of posts){
      const dt=new Date(p.timestamp);
      const h=dt.getUTCHours(),d=(dt.getUTCDay()+6)%7;
      const k=d+'-'+h;
      const eng=(p.like_count||0)+(p.comments_count||0);
      if(!he[k])he[k]={t:0,c:0};
      he[k].t+=eng;he[k].c++;
    }
    const avg={};
    for(const[k,v]of Object.entries(he))avg[k]=v.t/v.c;
    const allAvg=Object.values(avg);
    const mx=Math.max(...allAvg),mn=Math.min(...allAvg),range=(mx-mn)||1;

    const filled=new Set();
    for(const[k,v]of Object.entries(avg)){
      const[ds,hs]=k.split('-').map(Number);
      grid[ds][hs]=Math.max(0,Math.min(1,(v-mn)/range));
      filled.add(k);
    }
    // Interpolate gaps: ONLY from neighbor data, no made-up patterns
    for(let d=0;d<7;d++)for(let h=0;h<24;h++){
      if(filled.has(d+'-'+h))continue;
      const nb=[];
      if(filled.has(d+'-'+(h-1)))nb.push(grid[d][h-1]);
      if(filled.has(d+'-'+(h+1)))nb.push(grid[d][h+1]);
      if(filled.has(((d+6)%7)+'-'+h))nb.push(grid[(d+6)%7][h]);
      if(filled.has(((d+1)%7)+'-'+h))nb.push(grid[(d+1)%7][h]);
      if(filled.has(d+'-'+(h-2)))nb.push(grid[d][h-2]);
      if(filled.has(d+'-'+(h+2)))nb.push(grid[d][h+2]);
      grid[d][h]=nb.length>0?nb.reduce((a,b)=>a+b,0)/nb.length:0.5;
    }
    const coverage=Math.round(filled.size/(7*24)*100);
    let bD=0,bH=0,bV=0;
    for(let d=0;d<7;d++)for(let h=0;h<24;h++)if(grid[d][h]>bV){bV=grid[d][h];bD=d;bH=h}
    signalInfo.ig={type:'inferred',postCount:posts.length,coverage,bestDay:bD,bestHour:bH,weight:0.45};
  }else{
    for(let d=0;d<7;d++)for(let h=0;h<24;h++)grid[d][h]=0.5;
    signalInfo.ig={type:'fallback',postCount:0,coverage:0,weight:0.10};
  }
  return grid;
}

function computeIGDayFactor(posts){
  if(!posts||posts.length===0)return Array(7).fill(0.5);
  const dayEng=Array(7).fill(0),dayCnt=Array(7).fill(0);
  for(const p of posts){const dt=new Date(p.timestamp);const d=(dt.getUTCDay()+6)%7;dayEng[d]+=(p.like_count||0)+(p.comments_count||0);dayCnt[d]++}
  const dayAvg=dayEng.map((t,i)=>dayCnt[i]>0?t/dayCnt[i]:0);
  const maxA=Math.max(...dayAvg);
  if(maxA===0)return Array(7).fill(0.5);
  return dayAvg.map(v=>v/maxA);
}

function computeFB(){
  const grid=Array.from({length:7},()=>new Float64Array(24));
  const inf=results.meta?.fb_inferred_times?.data;
  if(inf&&Object.keys(inf).length>0){
    const vals=Object.values(inf);const mx=Math.max(...vals),mn=Math.min(...vals),range=mx-mn||1;
    const filled=new Set();
    for(const[k,v]of Object.entries(inf)){const[ds,hs]=k.split('-').map(Number);const d=(ds+6)%7;grid[d][hs]=(v-mn)/range;filled.add(d+'-'+hs)}
    const igG=scoreCache.ig;
    for(let d=0;d<7;d++)for(let h=0;h<24;h++)if(!filled.has(d+'-'+h)){
      const nb=[];if(filled.has(d+'-'+(h-1)))nb.push(grid[d][h-1]);if(filled.has(d+'-'+(h+1)))nb.push(grid[d][h+1]);
      const nbA=nb.length>0?nb.reduce((a,b)=>a+b,0)/nb.length:0.3;
      grid[d][h]=igG?igG[d][h]*0.4+nbA*0.6:nbA;
    }
    const pc=results.meta?.fb_post_history?.count||0;
    let bD=0,bH=0,bV=0;for(let d=0;d<7;d++)for(let h=0;h<24;h++)if(grid[d][h]>bV){bV=grid[d][h];bD=d;bH=h}
    signalInfo.fb={type:'real',postCount:pc,bestDay:bD,bestHour:bH,weight:0.35};
  }else{
    for(let d=0;d<7;d++)for(let h=0;h<24;h++)grid[d][h]=0.5;
    signalInfo.fb={type:'fallback',weight:0.10};
  }
  return grid;
}

function computeCombined(){
  const grid=Array.from({length:7},()=>new Float64Array(24));
  const w={};let tot=0;
  if(state.ig&&scoreCache.ig){w.ig=signalInfo.ig?.weight||0.3;tot+=w.ig}
  if(state.fb&&scoreCache.fb){w.fb=signalInfo.fb?.weight||0.15;tot+=w.fb}
  if(tot===0)return grid;
  for(const k of Object.keys(w))w[k]/=tot;
  for(let d=0;d<7;d++)for(let h=0;h<24;h++){
    let v=0;if(w.ig)v+=scoreCache.ig[d][h]*w.ig;if(w.fb)v+=scoreCache.fb[d][h]*w.fb;grid[d][h]=v;
  }
  signalInfo.combined={weights:w};
  return grid;
}

// ── Heatmap Colors ──
function lerpC(c1,c2,t){return[Math.round(c1[0]+(c2[0]-c1[0])*t),Math.round(c1[1]+(c2[1]-c1[1])*t),Math.round(c1[2]+(c2[2]-c1[2])*t)]}
function heatColor(val,pal){
  const palettes={combined:[[240,253,244],[134,239,172],[34,197,94],[21,128,61]],ig:[[252,228,236],[244,143,177],[233,30,99],[173,20,87]],fb:[[227,242,253],[100,181,246],[24,119,242],[13,71,161]]};
  const p=palettes[pal]||palettes.combined;
  const t=isNaN(val)?0:Math.max(0,Math.min(1,val));
  const seg=t*(p.length-1);const i=Math.floor(seg);const f=seg-i;
  if(i>=p.length-1){const c=p[p.length-1];return`rgb(${c[0]},${c[1]},${c[2]})`}
  const c=lerpC(p[i],p[i+1],f);return`rgb(${c[0]},${c[1]},${c[2]})`;
}

// ── Recommendations ──
function buildRecs(){
  const cg=scoreCache.combined;if(!cg)return;
  const slots=[];
  for(let d=0;d<7;d++)for(let h=0;h<24;h++)slots.push({d,h,score:cg[d][h]});
  slots.sort((a,b)=>b.score-a.score);
  const picked=[];
  for(const s of slots){if(picked.length>=5)break;if(picked.some(p=>p.d===s.d&&Math.abs(p.h-s.h)<2))continue;picked.push(s)}
  if(!picked.length)return;

  // Contextual description
  let desc='';
  const hasIGReal=state.ig&&signalInfo.ig?.type==='real';
  const hasIGInferred=state.ig&&signalInfo.ig?.type==='inferred';
  const hasFBReal=state.fb&&signalInfo.fb?.type==='real';
  if(hasIGReal&&hasFBReal)desc='These times are when your followers are most active and your posts get the most engagement. Posting here means more eyes on your content from the start.';
  else if(hasIGReal)desc='These times are when your followers are most active. Posting here means more eyes on your content from the start.';
  else if(hasIGInferred&&hasFBReal)desc='Based on which time slots drive the most engagement on your accounts, plus promising nearby windows you haven\'t tried yet.';
  else if(hasFBReal)desc='Based on when your Facebook posts get the most reactions, comments, and shares.';
  else if(hasIGInferred)desc='Based on which time slots drive the most engagement, plus promising nearby windows you haven\'t tried yet.';
  else desc='Based on available data from your connected accounts.';
  $('rdesc').textContent=desc;

  const g=$('rgrid');g.innerHTML='';
  for(let i=0;i<picked.length;i++){
    const s=picked[i];
    let topP='ig',topV=0;
    if(state.ig&&scoreCache.ig&&scoreCache.ig[s.d][s.h]>topV){topV=scoreCache.ig[s.d][s.h];topP='ig'}
    if(state.fb&&scoreCache.fb&&scoreCache.fb[s.d][s.h]>topV){topV=scoreCache.fb[s.d][s.h];topP='fb'}
    let why='';
    if(topP==='ig'){const ol=results.meta?.ig_online_followers?.data;why=ol?fmt(ol[String(s.h)]||0)+' followers active':'Peak engagement window'}
    else if(topP==='fb'){const inf=results.meta?.fb_inferred_times?.data;const fbD=(s.d+1)%7;const v=inf?.[fbD+'-'+s.h];if(v!=null){const allV=Object.values(inf);const avg=allV.reduce((a,b)=>a+b,0)/allV.length;const lift=avg>0?Math.round((v/avg-1)*100):0;why=lift>0?lift+'% more engagement than average':'Strong engagement window'}else why='High predicted engagement'}
    const pLabel=topP==='ig'?'Instagram':'Facebook';
    g.innerHTML+=`<div class="rec"><div class="rec-rank">#${i+1}</div><span class="rec-tag ${topP}">${pLabel}</span><div class="rec-time">${fmtH(s.h)}</div><div class="rec-day">${DAYS[s.d]}</div><div class="rec-why">${why}</div></div>`;
  }
  g.innerHTML+=`<p class="rec-tip">These times reflect when your audience engages, not just when you've posted before. Trying a new recommended slot could unlock hidden reach.</p>`;
  $('recs').classList.add('show');
}

// ── Calendar ──
function renderCal(p){
  const g=$('grid');g.innerHTML='';
  const key=p==='all'?'combined':p;
  const grid=scoreCache[key];
  if(!grid){console.warn('renderCal: no grid for',key);return}
  const ce=(tag,cls,txt)=>{const e=document.createElement(tag);e.className=cls;if(txt)e.textContent=txt;return e};
  g.appendChild(ce('div','gh',''));
  DAYS.forEach(d=>g.appendChild(ce('div','gh',d)));
  for(let h=0;h<24;h++){
    const tl=h===0?'12a':h<12?h+'a':h===12?'12p':(h-12)+'p';
    g.appendChild(ce('div','gt',tl));
    for(let d=0;d<7;d++){
      const val=grid[d][h];
      const color=heatColor(val,key);
      const level=val>0.85?'Peak activity':val>0.6?'High activity':val>0.3?'Moderate activity':'Low activity';
      let tip=`<strong>${DAYS[d]} ${fmtH(h)}</strong><br><span style="opacity:.8">${level}</span>`;
      if((p==='ig'||p==='all')&&state.ig){const ol=results.meta?.ig_online_followers?.data;if(ol)tip+=`<br>${fmt(ol[String(h)]||0)} followers active`}
      if((p==='fb'||p==='all')&&state.fb){const inf=results.meta?.fb_inferred_times?.data;if(inf){const fbD=(d+1)%7;const v=inf[fbD+'-'+h];if(v!=null)tip+=`<br>${v.toFixed(1)} avg engagement`}}
      const c=document.createElement('div');c.className='gc';c.style.backgroundColor=color;c.innerHTML=`<div class="tip">${tip}</div>`;g.appendChild(c);
    }
  }
}

function swTab(el){
  if(el.classList.contains('off'))return;
  const p=el.dataset.p;
  const key=p==='all'?'combined':p;
  if(!scoreCache[key]){console.warn('No score data for',key);return}
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  el.classList.add('on');curTab=p;
  $('leg').innerHTML=`<div><div class="lbar ${key}"></div><div class="llbl"><span>Low</span><span>High</span></div></div>`;
  renderExplainer(p);
  renderCal(curTab);
}

// ── Tab Explainer ──
function renderExplainer(p){
  const el=$('tab-explainer');
  if(!el)return;
  const w=signalInfo.combined?.weights||{};

  if(p==='fb'){
    const sf=signalInfo.fb;
    const count=sf?.postCount||0;
    const hasData=sf?.type==='real';
    el.innerHTML=`<div class="texpl">
      <div class="texpl-title">How We Score Facebook</div>
      <div class="texpl-sub">${hasData?`Your <strong>${count} posts</strong> tell us which days and hours drive the most engagement.`:'No post data available yet.'}</div>
      ${hasData?`<div class="texpl-insight">We mapped every reaction, comment, and share to the day and hour it happened. The darkest cells are where your audience consistently responds best.</div>
      <div class="texpl-steps">
        <div class="texpl-step"><span class="texpl-step-n fb">1</span><span class="texpl-step-t">We analyzed reactions, comments, and shares across all <strong>${count}</strong> of your posts</span></div>
        <div class="texpl-step"><span class="texpl-step-n fb">2</span><span class="texpl-step-t">Posts were grouped by day and hour to find your <strong>strongest time slots</strong></span></div>
        <div class="texpl-step"><span class="texpl-step-n fb">3</span><span class="texpl-step-t">For hours where you haven't posted yet, we estimated potential based on neighboring slots — <strong>these are opportunities worth testing</strong></span></div>
      </div>
      ${sf?.bestDay!=null?`<div class="texpl-highlight">Your strongest Facebook window: <strong>${DAYS[sf.bestDay]}s at ${fmtH(sf.bestHour)}</strong></div>`:''}`
      :`<div class="texpl-highlight">Connect Meta and have Facebook posts to see data-driven scores here.</div>`}
    </div>`;
  }

  else if(p==='ig'){
    const si=signalInfo.ig;
    const count=si?.postCount||0;
    el.innerHTML=`<div class="texpl">
      <div class="texpl-title">How We Score Instagram</div>
      <div class="texpl-sub">${si?.type==='real'?'We know exactly when your followers open Instagram, hour by hour.':si?.type==='inferred'?`Your <strong>${count} posts</strong> reveal which time slots drive the most engagement.`:'No data available yet.'}</div>
      ${si?.type==='real'?`<div class="texpl-insight">Meta tells us how many of your followers are active each hour of the day. This is the gold standard — it shows audience availability <strong>regardless of when you currently post</strong>.</div>
      <div class="texpl-steps">
        <div class="texpl-step"><span class="texpl-step-n ig">1</span><span class="texpl-step-t">Meta's API provides <strong>24 hourly data points</strong> showing when your ${fmt(si.peak)} followers are scrolling</span></div>
        <div class="texpl-step"><span class="texpl-step-n ig">2</span><span class="texpl-step-t">We combine this with day-of-week engagement from your <strong>${count} posts</strong></span></div>
        <div class="texpl-step"><span class="texpl-step-n ig">3</span><span class="texpl-step-t">The result: a map of when your content has the <strong>best chance of being seen</strong></span></div>
      </div>
      <div class="texpl-highlight">Peak activity: <strong>${fmt(si.peak)} followers</strong> at <strong>${fmtH(si.peakHour)}</strong></div>`
      :si?.type==='inferred'?`<div class="texpl-insight">Without direct follower activity data, we reverse-engineered your best times from likes and comments across your posting history.</div>
      <div class="texpl-steps">
        <div class="texpl-step"><span class="texpl-step-n ig">1</span><span class="texpl-step-t">We analyzed likes and comments on all <strong>${count}</strong> of your Instagram posts</span></div>
        <div class="texpl-step"><span class="texpl-step-n ig">2</span><span class="texpl-step-t">Posts were mapped to their day and hour to find your <strong>engagement sweet spots</strong></span></div>
        <div class="texpl-step"><span class="texpl-step-n ig">3</span><span class="texpl-step-t">For time slots you haven't tried, we estimated potential from nearby patterns — <strong>these are opportunities worth testing</strong></span></div>
      </div>
      ${si?.bestDay!=null?`<div class="texpl-highlight">Your strongest Instagram window: <strong>${DAYS[si.bestDay]}s at ${fmtH(si.bestHour)}</strong></div>`:''}`
      :`<div class="texpl-highlight">Connect Meta to see data-driven Instagram scores here.</div>`}
    </div>`;
  }

  else if(p==='all'){
    const igW=Math.round((w.ig||0)*100);
    const fbW=Math.round((w.fb||0)*100);
    const si=signalInfo.ig;
    const sf=signalInfo.fb;
    el.innerHTML=`<div class="texpl">
      <div class="texpl-title">Your Combined Schedule</div>
      <div class="texpl-sub">A weighted blend of all your data sources. Stronger signals carry more weight.</div>
      ${(igW+fbW>0)?`<div class="texpl-wbar">
        ${fbW?`<div class="texpl-wbar-seg fb" style="width:${fbW}%"></div>`:''}
        ${igW?`<div class="texpl-wbar-seg ig" style="width:${igW}%"></div>`:''}
      </div>
      <div class="texpl-wlabels">
        ${state.fb?`<span><strong style="color:var(--fb)">${fbW}%</strong> Facebook</span>`:''}
        ${state.ig?`<span><strong style="color:var(--ig)">${igW}%</strong> Instagram</span>`:''}
      </div>`:''}
      <div class="texpl-steps" style="margin-top:14px">
        ${state.fb?`<div class="texpl-step"><span class="texpl-step-n fb">${fbW}%</span><span class="texpl-step-t"><strong>Facebook</strong> — ${sf?.type==='real'?'from <strong>'+sf.postCount+' posts</strong>, strongest at '+DAYS[sf.bestDay]+' '+fmtH(sf.bestHour):'no post data yet'}</span></div>`:''}
        ${state.ig?`<div class="texpl-step"><span class="texpl-step-n ig">${igW}%</span><span class="texpl-step-t"><strong>Instagram</strong> — ${si?.type==='real'?'real-time follower activity, peak '+fmt(si.peak)+' at '+fmtH(si.peakHour):si?.type==='inferred'?'from <strong>'+si.postCount+' posts</strong>, strongest at '+DAYS[si.bestDay]+' '+fmtH(si.bestHour):'no data yet'}</span></div>`:''}
      </div>
      <div class="texpl-insight" style="margin-top:14px">Platforms with direct audience data are weighted higher. Your schedule prioritizes reaching your audience when they're genuinely available.</div>
    </div>`;
  }
}

// ── Build Dashboard ──
function buildDashboard(){
  try{
    computeAllScores();
  }catch(e){
    console.error('computeAllScores error:',e);
    feedStart('err-scores','Error computing scores');
    feedEnd('err-scores',e.message,'fail');
  }
  try{
    buildSignalCards();
  }catch(e){
    console.error('buildSignalCards error:',e);
    feedStart('err-sigs','Error building signals');
    feedEnd('err-sigs',e.message,'fail');
  }
  try{
    buildRecs();
  }catch(e){
    console.error('buildRecs error:',e);
    feedStart('err-recs','Error building recommendations');
    feedEnd('err-recs',e.message,'fail');
  }
  // Enable Combined tab if we have combined scores
  if(scoreCache.combined){
    const allBtn=document.querySelector('[data-p="all"]');
    if(allBtn)allBtn.classList.remove('off');
  }
  try{
    renderExplainer(curTab);
  }catch(e){
    console.error('renderExplainer error:',e);
  }
  try{
    renderCal(curTab);
    $('sched').classList.add('show');
  }catch(e){
    console.error('renderCal error:',e);
    feedStart('err-cal','Error rendering heatmap');
    feedEnd('err-cal',e.message,'fail');
  }
}
</script>
</body>
</html>
